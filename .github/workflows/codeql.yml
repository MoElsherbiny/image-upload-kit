name: CodeQL SAST

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@45775bd8235bde6fec5fd6dedb1fb6be8dc2cd5f # v3.28.10
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@45775bd8235bde6fec5fd6dedb1fb6be8dc2cd5f # v3.28.10
        with:
          category: '/language:javascript-typescript'
